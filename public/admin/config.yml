backend:
  name: github
  repo: mooody/pjrepo
  branch: main
  base_url: https://oauth.example.com
  auth_endpoint: auth
publish_mode: editorial_workflow
locale: sv
media_folder: private-images
public_folder: /private-images
site_url: https://example.com
display_url: https://example.com
collections:
  - name: pages
    label: Vanliga sidor
    folder: src/content/pages
    create: true
    slug: "{{slug}}"
    format: frontmatter
    extension: md
    fields:
      - name: title
        label: Rubrik
        widget: string
      - name: description
        label: Kort beskrivning
        widget: text
      - name: draft
        label: Utkast (visas inte på webbplatsen)
        widget: boolean
        default: true
      - name: example
        label: Exempeltext
        widget: boolean
        default: false
      - name: date
        label: Datum
        widget: datetime
        required: false
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
        picker_utc: true
      - name: category
        label: Kategori
        widget: string
        required: false
      - name: tags
        label: Taggar
        widget: list
        required: false
      - name: image
        label: Bild
        widget: relation
        required: false
        collection: configuration
        file: images
        search_fields:
          - images.*.id
        value_field: images.*.id
        display_fields:
          - images.*.id
      - name: imageAlt
        label: Alternativ bildtext
        widget: string
        required: false
      - name: gallery
        label: Fler bilder
        widget: list
        required: false
        fields:
          - name: image
            label: Bild
            widget: relation
            required: false
            collection: configuration
            file: images
            search_fields:
              - images.*.id
            value_field: images.*.id
            display_fields:
              - images.*.id
          - name: alt
            label: Alt-text
            widget: string
      - name: sources
        label: Källor
        widget: list
        required: false
        fields:
          - name: title
            label: Källans titel
            widget: string
          - name: url
            label: Källans URL
            widget: string
            pattern:
              - ^https://
              - Ange en HTTPS-adress
      - name: reviewed
        label: Granskningsdatum
        widget: datetime
        required: false
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
        picker_utc: true
      - name: related
        label: Relaterat innehåll
        widget: list
        required: false
        fields:
          - name: label
            label: Länktext
            widget: string
          - name: href
            label: Intern adress
            widget: string
            pattern:
              - ^/[a-z0-9/-]+/$
              - Ange en intern adress med avslutande snedstreck
      - name: body
        label: Text
        widget: markdown
        buttons:
          - bold
          - italic
          - link
          - heading-two
          - heading-three
          - quote
          - bulleted-list
          - numbered-list
        editor_components: []
