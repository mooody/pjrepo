name: One-time product image optimization

on:
  push:
    branches: [feature/produkter-2026]
    paths:
      - scripts/optimize-product-images.mjs
      - .github/workflows/optimize-products.yml
      - product-sources/2026/*.png

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Create standalone optimized WebP images without added watermark
        run: node scripts/optimize-product-images.mjs
      - name: Replace temporary image imports and pieces with complete WebP images
        shell: bash
        run: |
          set -euo pipefail
          test "$(find public/product-images -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 8
          git rm -r -- product-sources/2026
          git add -- public/product-images
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Replace imported PNG pieces with eight complete optimized WebP images"
          git push origin "HEAD:feature/produkter-2026"
