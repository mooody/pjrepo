# Anpassa domän och sökväg. Kör certbot efter att HTTP fungerar.
server {
    listen 80;
    listen [::]:80;
    server_name example.com;
    root /var/www/tradgardsdrommar/current;
    index index.html;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location / { try_files $uri $uri/ =404; }
    location ~ ^/(private-images|src|node_modules|\.git)(/|$) { deny all; }
    location /admin/ { add_header X-Robots-Tag "noindex, nofollow" always; }
    location /media/ { expires 7d; }
    error_page 404 /404.html;
}
